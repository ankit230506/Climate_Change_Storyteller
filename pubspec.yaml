name: climate_storyteller
description: AI-narrated climate storytelling visualizer for the Liquid Galaxy platform.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^2.9.0
  mobile_scanner: ^5.0.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  http: ^1.2.1
  path_provider: ^2.1.3
  audioplayers: ^6.0.0
  fl_chart: ^0.68.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_tts: ^4.0.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true



