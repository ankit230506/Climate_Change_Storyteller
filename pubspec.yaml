name: climate_storyteller
description: AI-narrated climate storytelling visualizer for the Liquid Galaxy platform.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SSH communication with LG rig
  dartssh2: ^2.9.0

  # QR scanner for LG Connect screen
  mobile_scanner: ^5.0.0

  # Secure local storage for API keys
  flutter_secure_storage: ^9.2.2

  # Google Fonts
  google_fonts: ^6.2.1

  # HTTP client — NASA GIBS, NOAA, Gemini, OpenAQ
  http: ^1.2.1

  # Local file path for KML cache
  path_provider: ^2.1.3

  # NOTE: google_maps_flutter removed — add back in Milestone 2
  # after setting up Maps API key in AndroidManifest.xml

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true